<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SUJAL HAWK 2026 - SINGLE GC LONG-TERM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; min-height: 100vh; }
        .card { background: rgba(0,255,0,0.08); border: 2px solid #0f0; border-radius: 15px; padding: 25px; }
        input, textarea { background: #000; color: #0f0; border: 1px solid #0f0; }
        .console { background: #000; color: #0f0; height: 520px; overflow-y: auto; padding: 15px; border: 2px solid #0f0; font-size: 13px; }
        .btn-success { background: #0f0; color: #000; border: none; }
        .btn-danger { background: #f00; color: #fff; border: none; }
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4">
<div class="container">
    <h1 class="text-center display-4 mb-4">SUJAL HAWK 2026 - SINGLE GC LONG-TERM</h1>
    
    <div class="text-center mb-4">
        <span id="status" class="badge bg-secondary fs-3 px-5 py-2">STOPPED</span>
        <span class="badge bg-success fs-3 mx-3">SENT: <span id="sent">0</span></span>
        <span class="badge bg-info fs-3">UPTIME: <span id="uptime">00:00:00</span></span>
    </div>

    <form id="form" class="card mb-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label">Accounts (username:password - 1 per line)</label>
                <textarea name="accounts" class="form-control" rows="4" placeholder="username1:password1&#10;username2:password2&#10;..." required></textarea>
            </div>
            
            <div class="col-12">
                <label class="form-label">Thread ID (Single Group)</label>
                <input name="thread_id" class="form-control" placeholder="Enter Single Thread ID" required>
            </div>
            
            <div class="col-12">
                <label class="form-label">Name Bases (Multi NC - 1 per line)</label>
                <textarea name="name_bases" class="form-control" rows="3" placeholder="AYUSH RANDIKE&#10;PRABHAT CHUDAKKAD&#10;..."></textarea>
            </div>
            
            <div class="col-12">
                <label class="form-label">Messages (1 per line)</label>
                <textarea name="messages" class="form-control" rows="5" placeholder="Your long spam messages..." required></textarea>
            </div>
            
            <div class="col-md-3"><input name="message_delay" type="number" step="0.1" class="form-control" value="45" placeholder="Message Delay (sec)"></div>
            <div class="col-md-3"><input name="name_change_delay" type="number" step="0.1" class="form-control" value="5" placeholder="Name Change Delay"></div>
            <div class="col-md-3"><input name="switch_delay" type="number" step="0.1" class="form-control" value="3" placeholder="Account Switch Delay"></div>
            <div class="col-md-3"><input name="cycle_break" type="number" class="form-control" value="300" placeholder="Cycle Break (sec)"></div>
        </div>
        
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success btn-lg px-5">START LONG-TERM</button>
            <button type="button" onclick="fetch('/stop').then(update)" class="btn btn-danger btn-lg px-5 ms-3">STOP</button>
        </div>
    </form>

    <div class="card">
        <h3 class="text-center">LIVE CONSOLE (RAM + CPU + IST + Long-term)</h3>
        <div id="console" class="console"></div>
    </div>
</div>

<script>
function update(){
    fetch("/status").then(r=>r.json()).then(d=>{
        document.getElementById("sent").innerText = d.sent;
        document.getElementById("uptime").innerText = d.uptime;
        document.getElementById("status").innerText = d.running ? "RUNNING" : "STOPPED";
        document.getElementById("status").className = d.running ? "badge bg-danger blink fs-3 px-5 py-2" : "badge bg-secondary fs-3 px-5 py-2";
        document.getElementById("console").innerHTML = d.logs.map(l => `<div>${l}</div>`).join("");
        document.getElementById("console").scrollTop = 999999;
    });
}
document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    fetch("/start", {method: "POST", body: new FormData(e.target)}).then(update);
};
setInterval(update, 2000);
update();
</script>
</body>
</html>
